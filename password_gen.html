<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">
  <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">🔐 Password Generator</h1>

    <div class="mb-4 text-left space-y-2">
      <label class="block">
        Length:
        <input id="length" type="number" min="4" max="32" value="12" class="w-full p-2 border rounded" />
      </label>

      <label class="block">
        <input type="checkbox" id="uppercase" checked /> Include Uppercase Letters
      </label>
      <label class="block">
        <input type="checkbox" id="lowercase" checked /> Include Lowercase Letters
      </label>
      <label class="block">
        <input type="checkbox" id="numbers" checked /> Include Numbers
      </label>
      <label class="block">
        <input type="checkbox" id="symbols" /> Include Symbols
      </label>
    </div>

    <button onclick="generatePassword()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Generate Password
    </button>

    <div class="mt-4">
      <input
        id="result"
        type="text"
        readonly
        class="w-full text-center p-2 border rounded font-mono text-lg"
      />
      <button onclick="copyPassword()" class="mt-2 text-blue-600 hover:underline">📋 Copy</button>
    </div>
  </div>

  <script>
    function generatePassword() {
      const length = parseInt(document.getElementById("length").value);
      const includeUpper = document.getElementById("uppercase").checked;
      const includeLower = document.getElementById("lowercase").checked;
      const includeNumbers = document.getElementById("numbers").checked;
      const includeSymbols = document.getElementById("symbols").checked;

      const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lower = "abcdefghijklmnopqrstuvwxyz";
      const numbers = "0123456789";
      const symbols = "!@#$%^&*()_+-=[]{}|;:,.<>?/";

      let characters = "";
      if (includeUpper) characters += upper;
      if (includeLower) characters += lower;
      if (includeNumbers) characters += numbers;
      if (includeSymbols) characters += symbols;

      if (!characters) {
        alert("Please select at least one option.");
        return;
      }

      let password = "";
      for (let i = 0; i < length; i++) {
        const randIndex = Math.floor(Math.random() * characters.length);
        password += characters[randIndex];
      }

      document.getElementById("result").value = password;
    }

    function copyPassword() {
      const result = document.getElementById("result");
      result.select();
      document.execCommand("copy");
      alert("Password copied to clipboard!");
    }
  </script>
</body>
</html>
